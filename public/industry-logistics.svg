<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>AI for Logistics — Kovil AI Route Optimization and Supply Chain AI</title>
  <defs>
    <linearGradient id="lo-bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#040A14"/>
      <stop offset="100%" stop-color="#080A10"/>
    </linearGradient>
    <radialGradient id="lo-blue" cx="70%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0050A0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0050A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lo-orange" cx="60%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#FF4F00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF4F00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="truck-body" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0E1E34"/>
      <stop offset="100%" stop-color="#081428"/>
    </linearGradient>
    <linearGradient id="truck-cab" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#162840"/>
      <stop offset="100%" stop-color="#0A1A2E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#lo-bg)"/>
  <rect width="1200" height="630" fill="url(#lo-blue)"/>
  <rect width="1200" height="630" fill="url(#lo-orange)"/>

  <!-- Dot grid -->
  <g opacity="0.04" fill="white">
    <circle cx="100" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/><circle cx="400" cy="100" r="1.5"/><circle cx="500" cy="100" r="1.5"/>
    <circle cx="100" cy="200" r="1.5"/><circle cx="200" cy="200" r="1.5"/><circle cx="300" cy="200" r="1.5"/><circle cx="400" cy="200" r="1.5"/><circle cx="500" cy="200" r="1.5"/>
    <circle cx="100" cy="300" r="1.5"/><circle cx="200" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/><circle cx="400" cy="300" r="1.5"/>
    <circle cx="100" cy="400" r="1.5"/><circle cx="200" cy="400" r="1.5"/><circle cx="300" cy="400" r="1.5"/>
    <circle cx="100" cy="500" r="1.5"/><circle cx="200" cy="500" r="1.5"/>
  </g>

  <!-- Orange left border -->
  <rect x="0" y="0" width="6" height="630" fill="#FF4F00"/>

  <!-- ===== LEFT TEXT CONTENT ===== -->
  <rect x="40" y="48" width="98" height="28" rx="14" fill="#FF4F00"/>
  <text x="89" y="67" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">KOVIL AI</text>

  <text x="40" y="130" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#FF4F00" letter-spacing="4">AI FOR LOGISTICS</text>

  <text x="40" y="210" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="white">Route</text>
  <text x="40" y="282" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="white">Optimize.</text>
  <text x="40" y="354" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="#FF4F00">Deliver.</text>

  <text x="40" y="405" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#3A5070">Forecasting · Carrier AI · Visibility</text>

  <rect x="40" y="440" width="175" height="88" rx="10" fill="#081018" stroke="#0E1E30" stroke-width="1"/>
  <text x="128" y="480" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#FF4F00" text-anchor="middle">$2M Seed</text>
  <text x="128" y="500" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#3A5070" text-anchor="middle">on 4-Week MVP</text>
  <text x="128" y="518" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#3A5070" text-anchor="middle">Secured</text>

  <rect x="233" y="440" width="165" height="88" rx="10" fill="#081018" stroke="#0E1E30" stroke-width="1"/>
  <text x="316" y="484" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="white" text-anchor="middle">20%</text>
  <text x="316" y="508" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#3A5070" text-anchor="middle">Route Cost Cut</text>

  <!-- ===== RIGHT ILLUSTRATION: TRUCK + ROUTE NETWORK ===== -->

  <!-- World map dots (background) -->
  <g fill="#1A2E50" opacity="0.35">
    <!-- North America rough outline dots -->
    <circle cx="680" cy="180" r="2"/><circle cx="700" cy="175" r="2"/><circle cx="720" cy="172" r="2"/><circle cx="740" cy="170" r="2"/>
    <circle cx="760" cy="175" r="2"/><circle cx="770" cy="190" r="2"/><circle cx="760" cy="205" r="2"/>
    <circle cx="750" cy="215" r="2"/><circle cx="730" cy="218" r="2"/><circle cx="710" cy="215" r="2"/>
    <circle cx="695" cy="205" r="2"/><circle cx="685" cy="192" r="2"/>
    <!-- Europe dots -->
    <circle cx="870" cy="160" r="2"/><circle cx="890" cy="155" r="2"/><circle cx="910" cy="158" r="2"/>
    <circle cx="925" cy="165" r="2"/><circle cx="920" cy="178" r="2"/><circle cx="905" cy="182" r="2"/>
    <circle cx="885" cy="180" r="2"/><circle cx="870" cy="173" r="2"/>
    <!-- Asia dots -->
    <circle cx="1010" cy="155" r="2"/><circle cx="1035" cy="150" r="2"/><circle cx="1060" cy="155" r="2"/>
    <circle cx="1080" cy="163" r="2"/><circle cx="1075" cy="178" r="2"/><circle cx="1055" cy="182" r="2"/>
    <circle cx="1030" cy="180" r="2"/><circle cx="1010" cy="170" r="2"/>
    <!-- More landmass dots -->
    <circle cx="930" cy="225" r="2"/><circle cx="950" cy="220" r="2"/><circle cx="970" cy="225" r="2"/>
    <circle cx="945" cy="240" r="2"/><circle cx="925" cy="245" r="2"/>
  </g>

  <!-- Route network lines -->
  <g stroke="#1A3A60" stroke-width="1.5" fill="none" opacity="0.5">
    <line x1="730" y1="195" x2="895" y2="168"/>
    <line x1="895" y1="168" x2="1045" y2="162"/>
    <line x1="730" y1="195" x2="940" y2="232"/>
    <line x1="895" y1="168" x2="940" y2="232"/>
    <line x1="940" y1="232" x2="1045" y2="162"/>
  </g>
  <!-- Route network highlighted path (active route) -->
  <polyline points="730,195 800,260 870,300 940,330 1020,360 1080,380"
    fill="none" stroke="#FF4F00" stroke-width="2" stroke-dasharray="8,5" opacity="0.6"/>

  <!-- Route nodes -->
  <g>
    <circle cx="730" cy="195" r="8" fill="#0E2040" stroke="#FF4F00" stroke-width="2"/>
    <circle cx="730" cy="195" r="4" fill="#FF4F00"/>
    <text x="730" y="215" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#FF4F00" text-anchor="middle" opacity="0.8">ORIGIN</text>

    <circle cx="800" cy="260" r="6" fill="#0E2040" stroke="#2A4A80" stroke-width="1.5"/>
    <circle cx="800" cy="260" r="3" fill="#2A4A80" opacity="0.8"/>

    <circle cx="870" cy="300" r="6" fill="#0E2040" stroke="#2A4A80" stroke-width="1.5"/>
    <circle cx="870" cy="300" r="3" fill="#2A4A80" opacity="0.8"/>

    <circle cx="940" cy="330" r="7" fill="#0E2040" stroke="#FF4F00" stroke-width="1.5" opacity="0.7"/>
    <circle cx="940" cy="330" r="3.5" fill="#FF4F00" opacity="0.6"/>

    <circle cx="1020" cy="360" r="6" fill="#0E2040" stroke="#2A4A80" stroke-width="1.5"/>
    <circle cx="1020" cy="360" r="3" fill="#2A4A80" opacity="0.8"/>

    <circle cx="1080" cy="380" r="9" fill="#0E2040" stroke="#FF4F00" stroke-width="2.5"/>
    <circle cx="1080" cy="380" r="4.5" fill="#FF4F00" opacity="0.9"/>
    <text x="1080" y="400" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#FF4F00" text-anchor="middle" opacity="0.8">DEST</text>
  </g>

  <!-- ===== DELIVERY TRUCK (large, center) ===== -->
  <!-- Truck trailer/body -->
  <rect x="640" y="390" width="360" height="155" rx="6" fill="url(#truck-body)" stroke="#1A3050" stroke-width="2"/>
  <!-- Trailer detail lines -->
  <line x1="700" y1="390" x2="700" y2="545" stroke="#0E1E38" stroke-width="1.5"/>
  <line x1="780" y1="390" x2="780" y2="545" stroke="#0E1E38" stroke-width="1.5"/>
  <line x1="860" y1="390" x2="860" y2="545" stroke="#0E1E38" stroke-width="1.5"/>
  <line x1="940" y1="390" x2="940" y2="545" stroke="#0E1E38" stroke-width="1.5"/>
  <!-- Kovil AI branding on trailer -->
  <text x="840" y="465" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1E3A60" text-anchor="middle" letter-spacing="3">KOVIL AI</text>
  <!-- Orange stripe on trailer -->
  <rect x="640" y="430" width="360" height="5" fill="#FF4F00" opacity="0.35"/>
  <rect x="640" y="500" width="360" height="5" fill="#FF4F00" opacity="0.2"/>

  <!-- Truck cab -->
  <rect x="960" y="410" width="175" height="135" rx="8" fill="url(#truck-cab)" stroke="#1E3558" stroke-width="2"/>
  <!-- Windshield -->
  <rect x="978" y="425" width="100" height="70" rx="6" fill="#060E1E" stroke="#1A2E4A" stroke-width="1.5"/>
  <!-- Windshield reflection -->
  <line x1="982" y1="430" x2="990" y2="490" stroke="white" stroke-width="1" opacity="0.04"/>
  <line x1="995" y1="427" x2="1005" y2="492" stroke="white" stroke-width="1" opacity="0.04"/>
  <!-- Cab roof vent -->
  <rect x="985" y="408" width="60" height="8" rx="4" fill="#1A2E4A"/>
  <!-- Door handle -->
  <rect x="1090" y="465" width="30" height="6" rx="3" fill="#1A2E4A"/>
  <!-- Side mirror -->
  <rect x="954" y="435" width="10" height="20" rx="3" fill="#0E1E34" stroke="#1A2E4A" stroke-width="1"/>
  <!-- Headlight -->
  <rect x="1118" y="428" width="22" height="14" rx="4" fill="#1E3A5A"/>
  <rect x="1121" y="431" width="16" height="8" rx="3" fill="#FF4F00" opacity="0.7"/>
  <!-- Grille -->
  <rect x="1118" y="448" width="22" height="55" rx="4" fill="#0A1828" stroke="#1A2E4A" stroke-width="1"/>
  <line x1="1121" y1="458" x2="1137" y2="458" stroke="#1A2E4A" stroke-width="1.5"/>
  <line x1="1121" y1="468" x2="1137" y2="468" stroke="#1A2E4A" stroke-width="1.5"/>
  <line x1="1121" y1="478" x2="1137" y2="478" stroke="#1A2E4A" stroke-width="1.5"/>
  <line x1="1121" y1="488" x2="1137" y2="488" stroke="#1A2E4A" stroke-width="1.5"/>
  <line x1="1130" y1="448" x2="1130" y2="503" stroke="#1A2E4A" stroke-width="1"/>

  <!-- Wheels -->
  <!-- Front axle wheels -->
  <circle cx="1080" cy="550" r="32" fill="#060C18" stroke="#1A2E4A" stroke-width="3"/>
  <circle cx="1080" cy="550" r="20" fill="#0A1628" stroke="#1A3050" stroke-width="2"/>
  <circle cx="1080" cy="550" r="8" fill="#0E2040"/>
  <circle cx="1080" cy="550" r="3" fill="#FF4F00" opacity="0.5"/>
  <!-- Rear axle wheels (double) -->
  <circle cx="710" cy="550" r="32" fill="#060C18" stroke="#1A2E4A" stroke-width="3"/>
  <circle cx="710" cy="550" r="20" fill="#0A1628" stroke="#1A3050" stroke-width="2"/>
  <circle cx="710" cy="550" r="8" fill="#0E2040"/>
  <circle cx="710" cy="550" r="3" fill="#FF4F00" opacity="0.5"/>
  <circle cx="760" cy="550" r="32" fill="#060C18" stroke="#1A2E4A" stroke-width="3"/>
  <circle cx="760" cy="550" r="20" fill="#0A1628" stroke="#1A3050" stroke-width="2"/>
  <circle cx="760" cy="550" r="8" fill="#0E2040"/>
  <circle cx="760" cy="550" r="3" fill="#FF4F00" opacity="0.5"/>

  <!-- Ground shadow -->
  <ellipse cx="860" cy="588" rx="380" ry="12" fill="#020608" opacity="0.7"/>

  <!-- Package icons (floating, upper right) -->
  <rect x="1090" y="120" width="60" height="60" rx="6" fill="#0A1828" stroke="#1A3050" stroke-width="1.5"/>
  <line x1="1090" y1="150" x2="1150" y2="150" stroke="#1A3050" stroke-width="1.5"/>
  <line x1="1120" y1="120" x2="1120" y2="180" stroke="#1A3050" stroke-width="1.5"/>
  <text x="1120" y="148" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" fill="#2A4A80">📦</text>

  <rect x="1110" y="200" width="50" height="50" rx="5" fill="#0A1828" stroke="#1A3050" stroke-width="1.5" transform="rotate(15, 1135, 225)"/>
  <text x="1135" y="230" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#2A4A80" transform="rotate(15, 1135, 225)">📦</text>

  <!-- AI optimized tag -->
  <rect x="660" y="355" width="150" height="28" rx="14" fill="#FF4F00" opacity="0.15" stroke="#FF4F00" stroke-width="1"/>
  <text x="735" y="374" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#FF4F00" text-anchor="middle" letter-spacing="1">AI OPTIMIZED ROUTE</text>

  <rect x="0" y="617" width="1200" height="13" fill="#FF4F00" opacity="0.1"/>
</svg>
