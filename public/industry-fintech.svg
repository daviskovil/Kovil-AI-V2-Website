<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>AI for FinTech — Kovil AI Financial Services AI Development</title>
  <defs>
    <linearGradient id="ft-bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#040E1C"/>
      <stop offset="100%" stop-color="#080A14"/>
    </linearGradient>
    <radialGradient id="ft-glow" cx="72%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF4F00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF4F00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ft-blue" cx="60%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card1-grad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1A2E5A"/>
      <stop offset="100%" stop-color="#0D1A38"/>
    </linearGradient>
    <linearGradient id="card2-grad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0E2840"/>
      <stop offset="100%" stop-color="#071428"/>
    </linearGradient>
    <linearGradient id="card3-grad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FF4F00"/>
      <stop offset="100%" stop-color="#CC3A00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ft-bg)"/>
  <rect width="1200" height="630" fill="url(#ft-glow)"/>
  <rect width="1200" height="630" fill="url(#ft-blue)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="white" stroke-width="1">
    <line x1="0" y1="157" x2="550" y2="157"/>
    <line x1="0" y1="315" x2="550" y2="315"/>
    <line x1="0" y1="473" x2="550" y2="473"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="250" y1="0" x2="250" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
  </g>

  <!-- Orange left border -->
  <rect x="0" y="0" width="6" height="630" fill="#FF4F00"/>

  <!-- ===== LEFT TEXT CONTENT ===== -->
  <rect x="40" y="48" width="98" height="28" rx="14" fill="#FF4F00"/>
  <text x="89" y="67" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">KOVIL AI</text>

  <text x="40" y="130" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#FF4F00" letter-spacing="4">AI FOR FINTECH</text>

  <text x="40" y="210" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="white">Payment</text>
  <text x="40" y="282" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="white">Fraud</text>
  <text x="40" y="354" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="#FF4F00">Intelligence</text>

  <text x="40" y="405" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#4A6890">KYC · Document AI · Compliance</text>

  <rect x="40" y="440" width="155" height="88" rx="10" fill="#0A1428" stroke="#152040" stroke-width="1"/>
  <text x="118" y="486" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#FF4F00" text-anchor="middle">18 days</text>
  <text x="118" y="510" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#4A6890" text-anchor="middle">Payment MVP</text>

  <rect x="213" y="440" width="170" height="88" rx="10" fill="#0A1428" stroke="#152040" stroke-width="1"/>
  <text x="298" y="486" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="white" text-anchor="middle">90%</text>
  <text x="298" y="510" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#4A6890" text-anchor="middle">Manual Entry Cut</text>

  <!-- ===== RIGHT ILLUSTRATION: CREDIT CARDS + CHART ===== -->

  <!-- Back card (dark blue, most rotated) -->
  <g transform="rotate(-18, 900, 320)">
    <rect x="680" y="180" width="380" height="240" rx="22" fill="url(#card2-grad)"/>
    <!-- Card chip -->
    <rect x="720" y="230" width="48" height="38" rx="6" fill="#0A2040" stroke="#1A3A60" stroke-width="1.5"/>
    <line x1="720" y1="249" x2="768" y2="249" stroke="#1A3A60" stroke-width="1"/>
    <line x1="744" y1="230" x2="744" y2="268" stroke="#1A3A60" stroke-width="1"/>
    <!-- Card number dots -->
    <circle cx="720" cy="305" r="4" fill="#1A3560" opacity="0.7"/>
    <circle cx="734" cy="305" r="4" fill="#1A3560" opacity="0.7"/>
    <circle cx="748" cy="305" r="4" fill="#1A3560" opacity="0.7"/>
    <circle cx="762" cy="305" r="4" fill="#1A3560" opacity="0.7"/>
    <circle cx="790" cy="305" r="4" fill="#1A3560" opacity="0.7"/>
    <circle cx="804" cy="305" r="4" fill="#1A3560" opacity="0.7"/>
    <circle cx="818" cy="305" r="4" fill="#1A3560" opacity="0.7"/>
    <circle cx="832" cy="305" r="4" fill="#1A3560" opacity="0.7"/>
  </g>

  <!-- Mid card (medium blue) -->
  <g transform="rotate(-7, 890, 330)">
    <rect x="680" y="180" width="380" height="240" rx="22" fill="url(#card1-grad)"/>
    <!-- Horizontal stripe -->
    <rect x="680" y="270" width="380" height="40" fill="#0A1E40" opacity="0.5"/>
    <!-- Card chip -->
    <rect x="720" y="218" width="50" height="40" rx="7" fill="#1A3560"/>
    <rect x="723" y="221" width="44" height="34" rx="5" fill="#0D2545"/>
    <line x1="720" y1="238" x2="770" y2="238" stroke="#1E3A65" stroke-width="1.5"/>
    <line x1="745" y1="218" x2="745" y2="258" stroke="#1E3A65" stroke-width="1.5"/>
    <!-- Number groups -->
    <text x="720" y="328" font-family="monospace" font-size="18" fill="#2A4870" letter-spacing="2">••••  ••••  ••••  4821</text>
    <!-- Logo circle -->
    <circle cx="990" cy="225" r="22" fill="#0A2040" opacity="0.6"/>
    <circle cx="1010" cy="225" r="22" fill="#152A50" opacity="0.5"/>
  </g>

  <!-- Front card (orange — Kovil AI branded) -->
  <g transform="rotate(4, 880, 340)">
    <rect x="660" y="190" width="390" height="245" rx="22" fill="url(#card3-grad)"/>
    <!-- Shine overlay -->
    <rect x="660" y="190" width="390" height="120" rx="22" fill="white" opacity="0.04"/>
    <!-- Chip -->
    <rect x="700" y="228" width="52" height="42" rx="7" fill="#CC3A00" opacity="0.8"/>
    <rect x="703" y="231" width="46" height="36" rx="5" fill="#AA2E00" opacity="0.6"/>
    <line x1="700" y1="249" x2="752" y2="249" stroke="#E04000" stroke-width="1.5" opacity="0.6"/>
    <line x1="726" y1="228" x2="726" y2="270" stroke="#E04000" stroke-width="1.5" opacity="0.6"/>
    <!-- KOVIL AI text -->
    <text x="700" y="305" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="white" opacity="0.9" letter-spacing="3">KOVIL AI</text>
    <!-- Number -->
    <text x="700" y="338" font-family="monospace" font-size="17" fill="white" opacity="0.7" letter-spacing="2">4892  ••••  ••••  7714</text>
    <!-- Expiry + name -->
    <text x="700" y="375" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="white" opacity="0.6">VALID 12/27</text>
    <text x="820" y="375" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="white" opacity="0.6" text-anchor="end">AI POWERED</text>
    <!-- Circles logo right -->
    <circle cx="990" cy="222" r="24" fill="white" opacity="0.15"/>
    <circle cx="1013" cy="222" r="24" fill="white" opacity="0.1"/>
  </g>

  <!-- Mini chart (below cards) -->
  <rect x="680" y="490" width="400" height="100" rx="12" fill="#08101E" stroke="#0E1E38" stroke-width="1.5"/>
  <text x="700" y="514" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#4A6890" letter-spacing="1">FRAUD DETECTION ACCURACY</text>
  <!-- Chart bars -->
  <rect x="710" y="545" width="28" height="35" rx="3" fill="#1A3060" opacity="0.6"/>
  <rect x="748" y="535" width="28" height="45" rx="3" fill="#1A3060" opacity="0.7"/>
  <rect x="786" y="528" width="28" height="52" rx="3" fill="#2A4080" opacity="0.8"/>
  <rect x="824" y="518" width="28" height="62" rx="3" fill="#2A4080"/>
  <rect x="862" y="508" width="28" height="72" rx="3" fill="#FF4F00" opacity="0.7"/>
  <rect x="900" y="498" width="28" height="82" rx="3" fill="#FF4F00" opacity="0.85"/>
  <rect x="938" y="492" width="28" height="88" rx="3" fill="#FF4F00"/>
  <!-- 94% label -->
  <text x="1042" y="530" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#FF4F00" text-anchor="middle">94%</text>
  <text x="1042" y="552" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#4A6890" text-anchor="middle">Precision</text>

  <rect x="0" y="617" width="1200" height="13" fill="#FF4F00" opacity="0.1"/>
</svg>
