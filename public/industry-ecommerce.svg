<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>AI for Ecommerce — Kovil AI Retail AI and Customer Support Automation</title>
  <defs>
    <linearGradient id="ec-bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#06050F"/>
      <stop offset="100%" stop-color="#0A080E"/>
    </linearGradient>
    <radialGradient id="ec-purple" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ec-orange" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#FF4F00" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FF4F00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bag-grad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1A0E30"/>
      <stop offset="100%" stop-color="#0D0820"/>
    </linearGradient>
    <linearGradient id="trend-grad" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FF4F00" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF4F00" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ec-bg)"/>
  <rect width="1200" height="630" fill="url(#ec-purple)"/>
  <rect width="1200" height="630" fill="url(#ec-orange)"/>

  <!-- Dot grid -->
  <g opacity="0.04" fill="white">
    <circle cx="100" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/><circle cx="400" cy="100" r="1.5"/><circle cx="500" cy="100" r="1.5"/>
    <circle cx="100" cy="200" r="1.5"/><circle cx="200" cy="200" r="1.5"/><circle cx="300" cy="200" r="1.5"/><circle cx="400" cy="200" r="1.5"/><circle cx="500" cy="200" r="1.5"/>
    <circle cx="100" cy="300" r="1.5"/><circle cx="200" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/><circle cx="400" cy="300" r="1.5"/>
    <circle cx="100" cy="400" r="1.5"/><circle cx="200" cy="400" r="1.5"/><circle cx="300" cy="400" r="1.5"/>
    <circle cx="100" cy="500" r="1.5"/><circle cx="200" cy="500" r="1.5"/>
  </g>

  <!-- Orange left border -->
  <rect x="0" y="0" width="6" height="630" fill="#FF4F00"/>

  <!-- ===== LEFT TEXT CONTENT ===== -->
  <rect x="40" y="48" width="98" height="28" rx="14" fill="#FF4F00"/>
  <text x="89" y="67" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">KOVIL AI</text>

  <text x="40" y="130" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#FF4F00" letter-spacing="4">AI FOR ECOMMERCE</text>

  <text x="40" y="210" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="white">Support.</text>
  <text x="40" y="282" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="white">Search.</text>
  <text x="40" y="354" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="#FF4F00">Revenue.</text>

  <text x="40" y="405" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5A4A80">Chatbot · Recommendations · Forecasting</text>

  <rect x="40" y="440" width="160" height="88" rx="10" fill="#0C0818" stroke="#1A1030" stroke-width="1"/>
  <text x="120" y="486" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#FF4F00" text-anchor="middle">70%</text>
  <text x="120" y="510" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#5A4A80" text-anchor="middle">Tickets Deflected</text>

  <rect x="218" y="440" width="175" height="88" rx="10" fill="#0C0818" stroke="#1A1030" stroke-width="1"/>
  <text x="306" y="486" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="white" text-anchor="middle">24/7</text>
  <text x="306" y="510" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#5A4A80" text-anchor="middle">AI Support Coverage</text>

  <!-- ===== RIGHT ILLUSTRATION: SHOPPING BAG + CHART + PRODUCTS ===== -->

  <!-- Revenue trend chart (background) -->
  <!-- Chart area fill -->
  <polygon points="620,490 660,460 710,440 760,410 820,380 880,340 940,295 1000,250 1060,210 1120,170 1170,145 1170,520 620,520"
    fill="url(#trend-grad)"/>
  <!-- Trend line -->
  <polyline points="620,490 660,460 710,440 760,410 820,380 880,340 940,295 1000,250 1060,210 1120,170 1170,145"
    fill="none" stroke="#FF4F00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- Chart dots -->
  <circle cx="820" cy="380" r="5" fill="#FF4F00" opacity="0.6"/>
  <circle cx="940" cy="295" r="5" fill="#FF4F00" opacity="0.7"/>
  <circle cx="1060" cy="210" r="5" fill="#FF4F00" opacity="0.8"/>
  <circle cx="1170" cy="145" r="7" fill="#FF4F00"/>
  <!-- Chart grid lines (faint) -->
  <line x1="620" y1="520" x2="1180" y2="520" stroke="#1A1030" stroke-width="1"/>
  <line x1="620" y1="420" x2="1180" y2="420" stroke="#1A1030" stroke-width="1" opacity="0.5"/>
  <line x1="620" y1="320" x2="1180" y2="320" stroke="#1A1030" stroke-width="1" opacity="0.5"/>
  <line x1="620" y1="220" x2="1180" y2="220" stroke="#1A1030" stroke-width="1" opacity="0.4"/>

  <!-- Shopping bag (large, center-right) -->
  <!-- Handle -->
  <path d="M790,180 Q790,130 840,130 Q890,130 890,180" fill="none" stroke="#2A1850" stroke-width="8" stroke-linecap="round"/>
  <!-- Bag body -->
  <rect x="730" y="175" width="220" height="250" rx="18" fill="url(#bag-grad)" stroke="#2A1850" stroke-width="2"/>
  <!-- Bag shine -->
  <rect x="734" y="179" width="212" height="60" rx="16" fill="white" opacity="0.03"/>
  <!-- Kovil AI logo on bag -->
  <text x="840" y="265" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FF4F00" text-anchor="middle" opacity="0.9">KOVIL</text>
  <text x="840" y="290" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FF4F00" text-anchor="middle" opacity="0.6">AI</text>
  <!-- Bag divider line -->
  <line x1="750" y1="315" x2="930" y2="315" stroke="#1A0E30" stroke-width="1.5"/>
  <!-- Item count indicator -->
  <circle cx="840" cy="360" r="22" fill="#FF4F00" opacity="0.15" stroke="#FF4F00" stroke-width="1.5"/>
  <text x="840" y="367" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FF4F00" text-anchor="middle">3</text>

  <!-- AI Chat bubble (top right) -->
  <rect x="980" y="120" width="185" height="90" rx="14" fill="#12082A" stroke="#2A1850" stroke-width="1.5"/>
  <path d="M1010,210 L1000,228 L1025,210" fill="#12082A" stroke="#2A1850" stroke-width="1.5"/>
  <text x="1000" y="152" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7C3AED" letter-spacing="1">AI ASSISTANT</text>
  <text x="1000" y="173" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="white">"Where's my order?"</text>
  <!-- Typing indicator -->
  <circle cx="1005" cy="192" r="4" fill="#FF4F00" opacity="0.8"/>
  <circle cx="1019" cy="192" r="4" fill="#FF4F00" opacity="0.6"/>
  <circle cx="1033" cy="192" r="4" fill="#FF4F00" opacity="0.4"/>
  <rect x="1055" y="183" width="90" height="18" rx="9" fill="#FF4F00" opacity="0.15"/>
  <text x="1100" y="196" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#FF4F00" text-anchor="middle">Deflected ✓</text>

  <!-- Product cards (floating, right side) -->
  <!-- Card 1 -->
  <rect x="980" y="250" width="100" height="115" rx="10" fill="#100A20" stroke="#1E1238" stroke-width="1.5"/>
  <rect x="990" y="260" width="80" height="60" rx="6" fill="#1A1030" opacity="0.8"/>
  <circle cx="1030" cy="290" r="20" fill="#2A1850" opacity="0.5"/>
  <text x="1030" y="296" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle">👟</text>
  <text x="1030" y="342" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9A8AB0" text-anchor="middle">$89.99</text>
  <rect x="990" y="350" width="80" height="8" rx="4" fill="#FF4F00" opacity="0.3"/>

  <!-- Card 2 -->
  <rect x="1092" y="270" width="100" height="115" rx="10" fill="#100A20" stroke="#1E1238" stroke-width="1.5"/>
  <rect x="1102" y="280" width="80" height="60" rx="6" fill="#1A1030" opacity="0.8"/>
  <circle cx="1142" cy="310" r="20" fill="#2A1850" opacity="0.5"/>
  <text x="1142" y="316" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle">👜</text>
  <text x="1142" y="362" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9A8AB0" text-anchor="middle">$124.99</text>
  <rect x="1102" y="370" width="80" height="8" rx="4" fill="#7C3AED" opacity="0.4"/>

  <!-- "Recommended by AI" label -->
  <rect x="980" y="388" width="212" height="22" rx="11" fill="#FF4F00" opacity="0.12" stroke="#FF4F00" stroke-width="1" opacity2="0.3"/>
  <text x="1086" y="403" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" fill="#FF4F00" text-anchor="middle" letter-spacing="1">RECOMMENDED BY AI</text>

  <!-- Up arrow accent (chart top) -->
  <polygon points="1170,100 1162,118 1178,118" fill="#FF4F00" opacity="0.8"/>
  <text x="1170" y="95" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#FF4F00" text-anchor="middle">+47%</text>

  <rect x="0" y="617" width="1200" height="13" fill="#FF4F00" opacity="0.1"/>
</svg>
