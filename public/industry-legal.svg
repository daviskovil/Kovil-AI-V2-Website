<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>AI for Legal — Kovil AI Contract Review and Legal Automation</title>
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#060C1E"/>
      <stop offset="100%" stop-color="#0A0A16"/>
    </linearGradient>
    <radialGradient id="lg-glow" cx="75%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#FF4F00" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FF4F00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lg-glow2" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1A3A8E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1A3A8E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#lg-bg)"/>
  <rect width="1200" height="630" fill="url(#lg-glow)"/>
  <rect width="1200" height="630" fill="url(#lg-glow2)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.04" fill="white">
    <circle cx="100" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/><circle cx="400" cy="100" r="1.5"/><circle cx="500" cy="100" r="1.5"/>
    <circle cx="100" cy="200" r="1.5"/><circle cx="200" cy="200" r="1.5"/><circle cx="300" cy="200" r="1.5"/><circle cx="400" cy="200" r="1.5"/><circle cx="500" cy="200" r="1.5"/>
    <circle cx="100" cy="300" r="1.5"/><circle cx="200" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/><circle cx="400" cy="300" r="1.5"/><circle cx="500" cy="300" r="1.5"/>
    <circle cx="100" cy="400" r="1.5"/><circle cx="200" cy="400" r="1.5"/><circle cx="300" cy="400" r="1.5"/><circle cx="400" cy="400" r="1.5"/><circle cx="500" cy="400" r="1.5"/>
    <circle cx="100" cy="500" r="1.5"/><circle cx="200" cy="500" r="1.5"/><circle cx="300" cy="500" r="1.5"/><circle cx="400" cy="500" r="1.5"/><circle cx="500" cy="500" r="1.5"/>
  </g>

  <!-- Orange left border -->
  <rect x="0" y="0" width="6" height="630" fill="#FF4F00"/>

  <!-- ===== LEFT TEXT CONTENT ===== -->
  <!-- Kovil AI chip -->
  <rect x="40" y="48" width="98" height="28" rx="14" fill="#FF4F00"/>
  <text x="89" y="67" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">KOVIL AI</text>

  <!-- Label -->
  <text x="40" y="130" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#FF4F00" letter-spacing="4">AI FOR LEGAL</text>

  <!-- Main heading -->
  <text x="40" y="210" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="white">Contract</text>
  <text x="40" y="282" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="white">Review</text>
  <text x="40" y="354" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="#FF4F00">Automated</text>

  <!-- Subtext -->
  <text x="40" y="405" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#4A6890">E-Discovery · Compliance · Legal RAG</text>

  <!-- Metric cards -->
  <rect x="40" y="440" width="160" height="88" rx="10" fill="#0B1530" stroke="#1A2E55" stroke-width="1"/>
  <text x="120" y="486" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#FF4F00" text-anchor="middle">78%</text>
  <text x="120" y="510" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#4A6890" text-anchor="middle">Faster Review</text>

  <rect x="218" y="440" width="190" height="88" rx="10" fill="#0B1530" stroke="#1A2E55" stroke-width="1"/>
  <text x="313" y="486" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="white" text-anchor="middle">$380K</text>
  <text x="313" y="510" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#4A6890" text-anchor="middle">Hours Reclaimed</text>

  <!-- ===== RIGHT ILLUSTRATION: SCALES OF JUSTICE ===== -->

  <!-- Pillar -->
  <rect x="846" y="130" width="10" height="350" rx="5" fill="#1A2E55"/>
  <!-- Pillar top ornament -->
  <circle cx="851" cy="123" r="18" fill="#FF4F00" opacity="0.9"/>
  <circle cx="851" cy="123" r="10" fill="#060C1E"/>
  <circle cx="851" cy="123" r="5" fill="#FF4F00" opacity="0.7"/>

  <!-- Balance beam (slightly tilted - left pan lower, right pan higher) -->
  <line x1="672" y1="218" x2="1030" y2="205" stroke="#1E3570" stroke-width="5" stroke-linecap="round"/>

  <!-- Left chain (3 segments) -->
  <line x1="672" y1="218" x2="670" y2="250" stroke="#1A2E55" stroke-width="2.5" stroke-dasharray="5,4"/>
  <line x1="670" y1="250" x2="672" y2="285" stroke="#1A2E55" stroke-width="2.5" stroke-dasharray="5,4"/>
  <line x1="672" y1="285" x2="670" y2="320" stroke="#1A2E55" stroke-width="2.5" stroke-dasharray="5,4"/>
  <!-- Left pan (lower) -->
  <ellipse cx="672" cy="332" rx="68" ry="15" fill="none" stroke="#FF4F00" stroke-width="2.5"/>
  <path d="M604 333 Q672 342 740 333" fill="#FF4F00" opacity="0.07"/>
  <!-- Left pan rim glow -->
  <ellipse cx="672" cy="332" rx="68" ry="15" fill="none" stroke="#FF4F00" stroke-width="1" opacity="0.4"/>

  <!-- Right chain (shorter) -->
  <line x1="1030" y1="205" x2="1028" y2="235" stroke="#1A2E55" stroke-width="2.5" stroke-dasharray="5,4"/>
  <line x1="1028" y1="235" x2="1030" y2="265" stroke="#1A2E55" stroke-width="2.5" stroke-dasharray="5,4"/>
  <line x1="1030" y1="265" x2="1028" y2="295" stroke="#1A2E55" stroke-width="2.5" stroke-dasharray="5,4"/>
  <!-- Right pan (higher) -->
  <ellipse cx="1030" cy="307" rx="68" ry="15" fill="none" stroke="#2A4A88" stroke-width="2.5"/>
  <path d="M962 308 Q1030 316 1098 308" fill="#2A4A88" opacity="0.05"/>

  <!-- Pillar base platform -->
  <rect x="811" y="480" width="80" height="14" rx="7" fill="#1A2E55"/>
  <rect x="796" y="494" width="110" height="8" rx="4" fill="#141E35"/>

  <!-- Document stack (below left pan, slightly right) -->
  <!-- Back doc (rotated) -->
  <g transform="rotate(-10, 760, 480)">
    <rect x="700" y="430" width="90" height="115" rx="7" fill="#09122A" stroke="#152040" stroke-width="1.5"/>
  </g>
  <!-- Mid doc -->
  <g transform="rotate(-4, 765, 480)">
    <rect x="710" y="420" width="90" height="115" rx="7" fill="#0B1530" stroke="#182845" stroke-width="1.5"/>
  </g>
  <!-- Front doc -->
  <rect x="720" y="412" width="90" height="118" rx="7" fill="#0E1A3A" stroke="#1E3565" stroke-width="1.5"/>
  <line x1="736" y1="434" x2="795" y2="434" stroke="#2040A0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="736" y1="450" x2="790" y2="450" stroke="#2040A0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="736" y1="466" x2="795" y2="466" stroke="#2040A0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="736" y1="482" x2="784" y2="482" stroke="#2040A0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- AI verified stamp -->
  <rect x="733" y="496" width="70" height="20" rx="4" fill="#FF4F00" opacity="0.85"/>
  <text x="768" y="510" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">AI VERIFIED</text>

  <!-- Circuit nodes (decorative) -->
  <circle cx="610" cy="155" r="4" fill="#FF4F00" opacity="0.5"/>
  <circle cx="568" cy="215" r="3" fill="#FF4F00" opacity="0.35"/>
  <circle cx="628" cy="275" r="5" fill="#2A5AAE" opacity="0.35"/>
  <circle cx="590" cy="340" r="3" fill="#FF4F00" opacity="0.25"/>
  <line x1="610" y1="155" x2="568" y2="215" stroke="#FF4F00" stroke-width="1" opacity="0.2"/>
  <line x1="568" y1="215" x2="628" y2="275" stroke="#2A5AAE" stroke-width="1" opacity="0.15"/>
  <line x1="628" y1="275" x2="590" y2="340" stroke="#FF4F00" stroke-width="1" opacity="0.15"/>

  <!-- Bottom stripe -->
  <rect x="0" y="617" width="1200" height="13" fill="#FF4F00" opacity="0.1"/>
  <rect x="0" y="624" width="1200" height="6" fill="#FF4F00" opacity="0.08"/>
</svg>
